<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Eight-pointed star (khatam): two overlapping squares, gilt on binding green -->
  <rect width="24" height="24" rx="5" fill="#1D4436"/>
  <g fill="none" stroke="#CFAA55" stroke-width="1.8" stroke-linejoin="round">
    <rect x="6" y="6" width="12" height="12"/>
    <rect x="6" y="6" width="12" height="12" transform="rotate(45 12 12)"/>
  </g>
  <circle cx="12" cy="12" r="2" fill="#CFAA55"/>
</svg>
